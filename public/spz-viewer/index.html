<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPZ Gaussian Splat Viewer</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: transparent;
        color: #e0e0e0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ─────────────────────────────────────────────────────── */

      /* ── Canvas area ─────────────────────────────────────────────────── */
      #canvas-container {
        flex: 1;
        position: relative;
        overflow: hidden;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }
      #renderCanvas:active { cursor: grabbing; }

      /* ── Loading overlay ─────────────────────────────────────────────── */
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: transparent;
        transition: opacity 0.6s ease;
        z-index: 5;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(212,170,255,0.15);
        border-top-color: #d4aaff;
        border-radius: 50%;
        animation: spin 0.85s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      #status {
        font-size: 13px;
        color: #999;
      }

      /* ── Error box ───────────────────────────────────────────────────── */
      #error-box {
        display: none;
        position: absolute;
        inset: 0;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 10px;
        padding: 32px;
        background: rgba(7,7,13,0.95);
        z-index: 6;
      }
      #error-box.visible { display: flex; }
      #error-box h2 { font-size: 15px; color: #ff7070; }
      #error-box p  { font-size: 12px; color: #888; max-width: 460px; text-align: center; line-height: 1.7; }

      /* ── Controls panel ──────────────────────────────────────────────── */
      #controls {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(10, 10, 20, 0.72);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 40px;
        padding: 6px 12px;
        backdrop-filter: blur(12px);
        z-index: 4;
        user-select: none;
      }

      .ctrl-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 28px;
        color: rgba(255,255,255,0.55);
        font-size: 12px;
        padding: 5px 12px;
        cursor: pointer;
        transition: color 0.15s, background 0.15s, border-color 0.15s;
        white-space: nowrap;
      }
      .ctrl-btn svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        fill: currentColor;
      }
      .ctrl-btn:hover {
        color: rgba(255,255,255,0.9);
        background: rgba(255,255,255,0.08);
      }
      .ctrl-btn.active {
        color: #d4aaff;
        background: rgba(212,170,255,0.12);
        border-color: rgba(212,170,255,0.3);
      }

      .divider {
        width: 1px;
        height: 18px;
        background: rgba(255,255,255,0.12);
        flex-shrink: 0;
      }

      /* ── Hint ────────────────────────────────────────────────────────── */
      #hint {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: rgba(255,255,255,0.2);
        pointer-events: none;
        white-space: nowrap;
        letter-spacing: 0.3px;
      }
    </style>

    <script type="module" src="./assets/index-BE7AWHQ8.js"></script>
  </head>
  <body>


    <div id="canvas-container">
      <canvas id="renderCanvas"></canvas>

      <!-- Loading -->
      <div id="overlay">
        <div class="spinner"></div>
        <div id="status">Loading Gaussian Splat…</div>
      </div>

      <!-- Error -->
      <div id="error-box">
        <h2>Failed to load splat</h2>
        <p id="error-msg"></p>
      </div>

      <!-- Hidden controls for JS to not crash -->
      <div style="display:none;">
        <button id="btn-auto"></button>
        <button id="btn-zoom-in"></button>
        <button id="btn-zoom-out"></button>
        <button id="btn-reset"></button>
      </div>
    </div>

  </body>
</html>
