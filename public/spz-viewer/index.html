<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mochiii lotus</title>
    <!-- The same font request as the page, so it comes from the cache. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: transparent; }
      body { position: relative; font-family: 'Inter', system-ui, sans-serif; }

      #renderCanvas {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        display: block;
        touch-action: pan-y; /* a swipe over the lotus scrolls the page */
      }

      /* Labels: not clickable, always upright, inside this frame. */
      #labels { position: absolute; inset: 0; pointer-events: none; user-select: none; }
      .label { position: absolute; inset: 0; transition: opacity 0.25s linear; }
      .label .dot {
        position: absolute; left: -4px; top: -4px;
        width: 8px; height: 8px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 0 2px #c2436b, 0 1px 4px rgba(80, 10, 40, 0.35);
      }
      .label .pill {
        position: absolute; left: 0; top: 0;
        white-space: nowrap;
        font-size: 14px; font-weight: 600; line-height: 1.2; letter-spacing: -0.005em;
        color: #3a0a1e;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(194, 67, 107, 0.3);
        border-radius: 999px;
        padding: 5px 11px;
        box-shadow: 0 2px 10px rgba(120, 20, 60, 0.14);
      }
      .phone .label .pill { font-size: 12px; padding: 4px 9px; }
    </style>
    <script type="module" src="./lotus.js"></script>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <div id="labels" aria-hidden="true"></div>
  </body>
</html>
